<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Cognitive Futures Lab website is under construction.">
  <title>Cognitive Futures Lab — Under construction</title>
  <style>
    :root {
      --ink: #101820;
      --signal: #16b8d4;
      --line: #dce5e9;
      --muted: #617078;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--white);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(24px, 4vw, 56px);
      overflow: hidden;
      position: relative;
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      pointer-events: none;
      background: var(--line);
    }

    .page::before {
      top: 0;
      bottom: 0;
      left: clamp(24px, 4vw, 56px);
      width: 1px;
    }

    .page::after {
      left: 0;
      right: 0;
      bottom: clamp(76px, 9vw, 116px);
      height: 1px;
    }

    .brand {
      display: inline-flex;
      align-items: stretch;
      gap: 16px;
      margin-left: 18px;
      position: relative;
      z-index: 1;
    }

    .brand-mark {
      width: 4px;
      border-radius: 999px;
      background: var(--signal);
    }

    .brand-name {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    main {
      align-self: center;
      width: min(1050px, 100%);
      padding: clamp(72px, 10vw, 150px) 0 clamp(80px, 11vw, 160px) 18px;
      position: relative;
      z-index: 1;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 0 0 rgba(22, 184, 212, .32);
      animation: pulse 2.4s ease-out infinite;
    }

    h1 {
      max-width: 980px;
      margin: 0;
      font-size: clamp(52px, 9.2vw, 132px);
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: .92;
    }

    .intro {
      max-width: 640px;
      margin: clamp(28px, 4vw, 46px) 0 0;
      color: var(--muted);
      font-size: clamp(17px, 1.7vw, 22px);
      line-height: 1.48;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 28px;
      padding: 28px 0 0 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      letter-spacing: .04em;
      position: relative;
      z-index: 1;
    }

    footer p { margin: 0; }

    footer a {
      color: inherit;
      text-underline-offset: 3px;
    }

    @keyframes pulse {
      70%, 100% { box-shadow: 0 0 0 12px rgba(22, 184, 212, 0); }
    }

    @media (max-width: 680px) {
      .page::after { bottom: 154px; }
      main { padding-top: 82px; padding-bottom: 100px; }
      footer { flex-direction: column; gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .status-dot { animation: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand" aria-label="Cognitive Futures Lab">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Cognitive<br>Futures<br>Lab</span>
      </div>
    </header>

    <main>
      <p class="status"><span class="status-dot" aria-hidden="true"></span>Website under construction</p>
      <h1>Thinking about<br>cognitive futures.</h1>
      <p class="intro">We are building a new home for our work on cognition, data and interactive technologies. Please check back soon.</p>
    </main>

    <footer>
      <p>TU Delft · Eindhoven University of Technology · University of Twente</p>
      <p>Supported by <a href="https://www.4tu.nl/nirict/">4TU.NIRICT</a></p>
    </footer>
  </div>
</body>
</html>
